services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseboard-postgres
    environment:
      POSTGRES_DB: pulseboard
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
    ports:
      - "5432:5432"
    volumes:
      - pulseboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulseboard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: pulseboard-localstack
    environment:
      - SERVICES=sqs
      - DEBUG=0
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  pulseboard-pgdata:
