spring:
  application:
    name: pulseboard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulseboard}
    username: ${DB_USER:pulseboard}
    password: ${DB_PASSWORD:pulseboard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

pulseboard:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please}
    ttl: ${JWT_TTL:PT12H}

logging:
  level:
    org.flywaydb: info
