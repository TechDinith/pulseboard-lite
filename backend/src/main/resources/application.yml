spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulseboard}
    username: ${DB_USER:pulseboard}
    password: ${DB_PASSWORD:pulseboard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

pulseboard:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    ttl: ${JWT_TTL:PT12H}
